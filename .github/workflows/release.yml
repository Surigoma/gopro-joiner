name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        run: |
          node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) throw new Error('tag must match package.json version: v' + version)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package-task: package:linux
            artifact-name: linux
          - os: windows-latest
            package-task: package:windows
            artifact-name: windows
          - os: macos-latest
            package-task: package:macos
            artifact-name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install pinned Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.51.1
      - name: Install locked dependencies
        run: task install
      - name: Compile and test
        run: task check
      - name: Package application
        run: task ${{ matrix.package-task }}
      - name: Smoke packaged application
        if: runner.os != 'Linux'
        run: task smoke:package
      - name: Smoke packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a task smoke:package
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: task audit
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "release/GoProJoiner-win32-x64" -DestinationPath "release/GoProJoiner-${env:GITHUB_REF_NAME}-windows-x64.zip"
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          arch="$(node -p 'process.arch')"
          ditto -c -k --sequesterRsrc --keepParent "release/GoPro Joiner.app" "release/GoProJoiner-${GITHUB_REF_NAME}-macos-${arch}.zip"
      - name: Archive Linux application
        if: runner.os == 'Linux'
        run: |
          arch="$(node -p 'process.arch')"
          tar -C release -czf "release/GoProJoiner-${GITHUB_REF_NAME}-linux-${arch}.tar.gz" "GoProJoiner-linux-${arch}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.artifact-name }}
          path: |
            release/GoProJoiner-v*.zip
            release/GoProJoiner-v*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum GoProJoiner-* | sort -k2 > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --generate-notes --title "GoPro Joiner ${GITHUB_REF_NAME}")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${args[@]}"
